name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build M7 Astrofox
        run: |
          cd m7-astrofox
          npm install --legacy-peer-deps
          npm run build-dev
          cd ..

      - name: Build frontend
        run: npm run build

      - name: Ensure ffmpeg, ffprobe, and yt-dlp binaries
        run: node tools/ensure-binaries.cjs

      - name: Build and publish Electron release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
